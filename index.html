<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <header>
            <div>
                <h1>Expense Tracker</h1>
                <p>Manage your income and expenses</p>
            </div>

            <button id="add-btn">+ Add Transaction</button>
        </header>


        <!-- Summary -->
        <section class="summary">

            <div class="card balance">
                <p>Balance</p>
                <h2 id="balance">₹0.00</h2>
            </div>

            <div class="card income">
                <p>Income</p>
                <h2 id="income">₹0.00</h2>
            </div>

            <div class="card expense">
                <p>Expenses</p>
                <h2 id="expenses">₹0.00</h2>
            </div>

        </section>


        <!-- Add Transaction -->
        <section id="form-section" class="form-section hidden">

            <h2 id="form-title">Add Transaction</h2>

            <form id="transaction-form">

                <div class="type-buttons">

                    <button
                        type="button"
                        class="type-btn active"
                        data-type="expense">
                        Expense
                    </button>

                    <button
                        type="button"
                        class="type-btn"
                        data-type="income">
                        Income
                    </button>

                </div>


                <label for="amount">Amount</label>

                <input
                    type="number"
                    id="amount"
                    placeholder="Enter amount"
                    min="1"
                    step="0.01"
                    required
                >


                <label for="category">Category</label>

                <select id="category" required>
                    <option value="">Select category</option>
                </select>


                <label for="date">Date</label>

                <input
                    type="date"
                    id="date"
                    required
                >


                <label for="description">Description</label>

                <input
                    type="text"
                    id="description"
                    placeholder="Enter description"
                    maxlength="100"
                    required
                >


                <div class="form-buttons">

                    <button type="submit" id="save-btn">
                        Add Transaction
                    </button>

                    <button type="button" id="cancel-btn">
                        Cancel
                    </button>

                </div>

            </form>

        </section>


        <!-- Filters -->
        <section class="filters">

            <button
                class="filter active"
                data-type="all">
                All
            </button>

            <button
                class="filter"
                data-type="income">
                Income
            </button>

            <button
                class="filter"
                data-type="expense">
                Expense
            </button>


            <select id="category-filter">
                <option value="all">All Categories</option>
            </select>

        </section>


        <!-- Transaction History -->
        <section class="transactions">

            <h2>Transaction History</h2>

            <div id="transaction-list">

                <p id="empty-message">
                    No transactions yet.
                </p>

            </div>

        </section>


        <!-- Monthly Summary -->
        <section class="monthly-summary">

            <h2>This Month</h2>

            <div class="monthly-values">

                <div>
                    <p>Income</p>
                    <strong id="month-income">₹0.00</strong>
                </div>

                <div>
                    <p>Expenses</p>
                    <strong id="month-expenses">₹0.00</strong>
                </div>

            </div>

        </section>


        <!-- Category Summary -->
        <section class="category-summary">

            <h2>Spending by Category</h2>

            <div id="category-chart">

                <p>No expenses to display.</p>

            </div>

        </section>

    </div>


    <script src="script.js"></script>

</body>

</html>
